<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Price Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #007bff;
        }
        .btn-track {
            width: 100%;
            background-color: #007bff;
            border: none;
        }
        .btn-track:hover {
            background-color: #0056b3;
        }
        .price-box {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
            margin-top: 20px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: gray;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Amazon Price Tracker</h1>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Enter Amazon Product URL</label>
            <input type="text" name="url" class="form-control" placeholder="Paste the product URL here" required>
        </div>
        <button type="submit" class="btn btn-primary btn-track">Check Price</button>
    </form>

    {% if price %}
        <div class="price-box">
            <p>Current Price: ₹{{ price }}</p>
        </div>
    {% endif %}

    <div class="footer">
        Made with ❤️ by DIVYANK
    </div>
</div>

</body>
</html>
